<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d5a">
<title>Urlaubsabrechnung</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Urlaub">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1 id="trip-title-display">Urlaubsabrechnung</h1>
  <button id="btn-settings" class="icon-btn" aria-label="Einstellungen">⚙️</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="erfassen">Erfassen</button>
  <button class="tab" data-tab="liste">Liste</button>
  <button class="tab" data-tab="auswertung">Auswertung</button>
</nav>

<main>

  <!-- ===== TAB: Erfassen ===== -->
  <section id="tab-erfassen" class="tab-panel active">
    <form id="expense-form">
      <label>
        Betrag
        <div class="amount-row">
          <input type="number" id="f-amount" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required>
          <span id="f-currency-label" class="currency-label">EUR</span>
        </div>
      </label>

      <label>
        Kategorie
        <select id="f-category" required></select>
      </label>

      <label>
        Datum
        <input type="date" id="f-date" required>
      </label>

      <label>
        Notiz (optional)
        <input type="text" id="f-note" placeholder="z.B. Restaurant Strandbar" maxlength="200">
      </label>

      <button type="submit" class="primary-btn">Hinzufügen</button>
    </form>
    <p id="save-hint" class="hint" hidden>✓ Gespeichert</p>
  </section>

  <!-- ===== TAB: Liste ===== -->
  <section id="tab-liste" class="tab-panel">
    <div class="list-toolbar">
      <input type="text" id="filter-search" placeholder="Suche in Notizen…">
      <select id="filter-category"></select>
    </div>
    <ul id="expense-list" class="expense-list"></ul>
    <p id="list-empty" class="hint" hidden>Noch keine Ausgaben erfasst.</p>
  </section>

  <!-- ===== TAB: Auswertung ===== -->
  <section id="tab-auswertung" class="tab-panel">
    <div class="summary-cards" id="summary-cards"></div>

    <h2>Nach Kategorie</h2>
    <canvas id="chart-category" width="600" height="280"></canvas>
    <ul id="category-legend" class="legend"></ul>

    <h2>Pro Tag</h2>
    <canvas id="chart-daily" width="600" height="220"></canvas>

    <div class="export-row">
      <button id="btn-export-csv">CSV exportieren</button>
      <button id="btn-export-json">Backup (JSON) exportieren</button>
    </div>
  </section>

</main>

<!-- ===== Settings Dialog ===== -->
<dialog id="settings-dialog">
  <form method="dialog" id="settings-form">
    <h2>Einstellungen</h2>

    <label>
      Reise-Titel
      <input type="text" id="s-trip-title" placeholder="z.B. Kroatien 2026" maxlength="60">
    </label>

    <label>
      Standard-Währung
      <select id="s-currency"></select>
    </label>

    <fieldset>
      <legend>Kategorien</legend>
      <ul id="category-manage-list" class="manage-list"></ul>
      <div class="add-row">
        <input type="text" id="s-new-category" placeholder="Neue Kategorie">
        <button type="button" id="btn-add-category">+</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Daten</legend>
      <div class="danger-row">
        <button type="button" id="btn-import-json">Backup importieren</button>
        <input type="file" id="import-file-input" accept="application/json" hidden>
      </div>
      <div class="danger-row">
        <button type="button" id="btn-clear-all" class="danger-btn">Alle Daten löschen</button>
      </div>
    </fieldset>

    <div class="dialog-actions">
      <button type="submit" class="primary-btn">Schließen</button>
    </div>
  </form>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
